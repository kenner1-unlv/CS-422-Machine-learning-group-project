name: Project tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-remaining-models.txt
      - name: Install pinned dependencies
        run: python -m pip install -r requirements-remaining-models.txt
      - name: Rebuild study sets and features
        run: |
          python scripts/build_study_sets.py
          python scripts/build_splits.py
          python scripts/build_features.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
